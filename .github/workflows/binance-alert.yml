name: Binance Listing Alert Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: binance-listing-alert
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Monitor Binance announcements
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from pathlib import Path

          TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "")

          if not TOKEN or not CHAT_ID:
              raise RuntimeError(
                  "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret."
              )

          url = (
              "https://www.binance.com/bapi/composite/v1/public/"
              "cms/article/catalog/list/query"
          )

          params = {
              "type": 1,
              "catalogId": 48,
              "pageNo": 1,
              "pageSize": 20,
          }

          response = requests.get(
              url,
              params=params,
              headers={"User-Agent": "Mozilla/5.0"},
              timeout=20,
          )
          response.raise_for_status()
          payload = response.json()

          if payload.get("success") is False:
              raise RuntimeError(
                  "Binance announcement request was unsuccessful."
              )

          data = payload.get("data") or {}
          articles = data.get("articles") or []

          if not articles:
              raise RuntimeError(
                  "No articles returned. Check the Binance endpoint "
                  "and catalog before relying on this monitor."
              )

          state_file = Path("seen_binance_articles.json")
          if state_file.exists():
              seen = set(json.loads(state_file.read_text()))
          else:
              seen = set()

          current_ids = {
              str(a.get("id"))
              for a in articles
              if a.get("id") is not None
          }

          if not seen:
              state_file.write_text(json.dumps(sorted(current_ids)))
              print("Initial setup complete; existing articles saved.")
          else:
              new_articles = [
                  a for a in articles
                  if a.get("id") is not None
                  and str(a["id"]) not in seen
              ]

              for article in reversed(new_articles):
                  title = article.get("title", "New Binance announcement")
                  article_code = article.get("code", "")
                  link = (
                      "https://www.binance.com/en/support/announcement/"
                      + str(article_code)
                      if article_code
                      else "https://www.binance.com/en/support/announcement"
                  )

                  message = (
                      "🚨 BINANCE ANNOUNCEMENT\n\n"
                      + title
                      + "\n\n"
                      + link
                  )

                  result = requests.post(
                      f"https://api.telegram.org/bot{TOKEN}/sendMessage",
                      json={
                          "chat_id": CHAT_ID,
                          "text": message,
                          "disable_web_page_preview": True,
                      },
                      timeout=20,
                  )
                  result.raise_for_status()

                  if not result.json().get("ok"):
                      raise RuntimeError("Telegram rejected the message.")

                  print("Alert sent:", title)

              seen.update(current_ids)
              state_file.write_text(json.dumps(sorted(seen)))

          print("Monitoring run completed.")
          PY

      - name: Save announcement history
        if: success()
        run: |
          if git diff --quiet -- seen_binance_articles.json; then
            echo "No history changes to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_binance_articles.json
          git commit -m "Update Binance announcement history"
          git push
